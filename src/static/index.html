<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Agent 控制台</title>
<style>
  /* ---------- 浅色（默认） ---------- */
  :root{
    --bg:#f3f5f9; --bg-2:#fafbfd;
    --panel:#ffffff; --panel-2:#f7f9fc;
    --line:#e6eaf2; --line-2:#d7deea; --focus:#a9bcf0;
    --ink:#0f172a; --ink-2:#57627a; --ink-3:#98a3b8;
    --brand:#4f46e5; --brand-2:#0891b2;
    --grad:linear-gradient(120deg,#2563eb,#4f46e5 55%,#0891b2);
    --bubble-grad:linear-gradient(130deg,#4f46e5,#5b5bf0 60%,#0e8fb5);
    --ok:#22c55e;
    --warn-bg:#fffbf1; --warn-line:#f2e2b8; --warn-ink:#8a5a00;
    --err-bg:#fff6f5; --err-line:#f5cdc8; --err-ink:#b42318;
    --shadow:0 18px 40px -24px rgba(15,23,42,.3);
    --bubble-shadow:0 1px 2px rgba(15,23,42,.05);
    /* 决策卡（浅色：与气泡同族的中性灰，不用深色终端块） */
    --dc-bg:#f7f9fc; --dc-hd:#eef2f8; --dc-line:#e3e9f3; --dc-ink:#3d4a61;
    --dc-axis:#dfe6f1; --dc-node-bg:#ffffff; --dc-node-line:#cfd9e8; --dc-node-ink:#5c6b86;
    --dc-tag:#44567a; --dc-meta:#94a2b8; --dc-caret:#a9b6c9;
    --dc-tool:#0f766e; --dc-tool-none:#b6c1d2;
    --dc-k:#1d4ed8; --dc-v:#9a6207; --dc-p:#a9b4c6; --dc-arg:#7e8ca4;
    --dc-res:#74839c; --dc-bar:#cfd9e8;
    --tc-cmd-bg:#e4ecff; --tc-cmd-ink:#1d4ed8;
    --tc-ans-bg:#ece8fe; --tc-ans-ink:#6d28d9;
    --tc-chat-bg:#eef1f6; --tc-chat-ink:#475569;
    /* 决策卡 · 本轮摘要（收起时才显示的一行结论） */
    --dc-sum-bg:#fbfcfe; --dc-sum-ink:#3d4a61;
    --dc-sum-tool:#0f766e; --dc-sum-weak:#98a3b8;
    /* 工具回执状态：成功 / 提示 / 失败 */
    --rt-ok-bg:#f2fbf5; --rt-ok-line:#cdead8; --rt-ok-ink:#15693d;
    --rt-warn-bg:#fffbf0; --rt-warn-line:#f2e2b8; --rt-warn-ink:#8a5a00;
    --rt-bad-bg:#fff5f4; --rt-bad-line:#f4cdc7; --rt-bad-ink:#b42318;
    /* 语义化入参：标签 / 引文 / 条号 */
    --dg-lbl:#98a3b8; --dg-lit:#1f2a3d; --dg-num-bg:#e7eefb; --dg-num-ink:#1d4ed8;
    --dg-quote-line:#cfd9e8;
  }
  /* ---------- 深色（可切换，比初版提亮一档） ---------- */
  html[data-theme="dark"]{
    --bg:#101827; --bg-2:#141d2e;
    --panel:#18223a; --panel-2:#1f2b46;
    --line:#26324c; --line-2:#33415f; --focus:#3d4f7e;
    --ink:#e6ecf8; --ink-2:#a3b0c8; --ink-3:#6b7b99;
    --brand:#818cf8; --brand-2:#38bdf8;
    --grad:linear-gradient(120deg,#60a5fa,#818cf8 55%,#22d3ee);
    --bubble-grad:linear-gradient(130deg,#4f46e5,#6366f1 60%,#0ea5e9);
    --ok:#34d399;
    --warn-bg:#2b2314; --warn-line:#55411c; --warn-ink:#e8c27a;
    --err-bg:#2c1917; --err-line:#583029; --err-ink:#f0a8a0;
    --shadow:0 18px 40px -24px rgba(0,0,0,.75);
    --bubble-shadow:none;
    /* 决策卡（深色：维持原有的深底终端感） */
    --dc-bg:#0b1220; --dc-hd:#121c33; --dc-line:#1c2740; --dc-ink:#bcc9e2;
    --dc-axis:#26334f; --dc-node-bg:#16203a; --dc-node-line:#2a3757; --dc-node-ink:#8fa6cc;
    --dc-tag:#9db4e8; --dc-meta:#5f6f8f; --dc-caret:#5f6f8f;
    --dc-tool:#6ee7b7; --dc-tool-none:#4c5b78;
    --dc-k:#7fb0ff; --dc-v:#e2c37f; --dc-p:#4c5b78; --dc-arg:#6c7c9c;
    --dc-res:#7e8dab; --dc-bar:#26334f;
    --tc-cmd-bg:rgba(96,165,250,.14); --tc-cmd-ink:#93c5fd;
    --tc-ans-bg:rgba(167,139,250,.15); --tc-ans-ink:#c4b5fd;
    --tc-chat-bg:rgba(148,163,184,.13); --tc-chat-ink:#b7c3d6;
    /* 决策卡 · 本轮摘要（收起时才显示的一行结论） */
    --dc-sum-bg:#0f1930; --dc-sum-ink:#bcc9e2;
    --dc-sum-tool:#6ee7b7; --dc-sum-weak:#5f6f8f;
    /* 工具回执状态：成功 / 提示 / 失败 */
    --rt-ok-bg:rgba(52,211,153,.07); --rt-ok-line:rgba(52,211,153,.24); --rt-ok-ink:#7fd6b0;
    --rt-warn-bg:rgba(232,194,122,.07); --rt-warn-line:rgba(232,194,122,.24); --rt-warn-ink:#e8c27a;
    --rt-bad-bg:rgba(240,168,160,.07); --rt-bad-line:rgba(240,168,160,.24); --rt-bad-ink:#f0a8a0;
    /* 语义化入参：标签 / 引文 / 条号 */
    --dg-lbl:#6b7b99; --dg-lit:#dbe4f6; --dg-num-bg:rgba(127,176,255,.15); --dg-num-ink:#9dc2ff;
    --dg-quote-line:#33415f;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:flex; background:var(--bg); color:var(--ink);
    font:14.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:rgba(99,102,241,.22); }

  /* ================= 侧栏 ================= */
  .side{
    flex:none; width:236px; display:flex; flex-direction:column; gap:14px;
    padding:16px 14px; background:var(--bg-2); border-right:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 4px; }
  .logo{
    width:32px; height:32px; flex:none; border-radius:10px;
    background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px -6px rgba(99,102,241,.65);
  }
  .title{ display:flex; flex-direction:column; line-height:1.3; }
  .title b{ font-size:14.5px; font-weight:650; letter-spacing:.3px; }
  .title span{ font-size:11px; color:var(--ink-3); }

  .new-chat{
    width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 12px; border-radius:11px; font-size:13.5px;
    background:var(--panel); border:1px solid var(--line-2); color:var(--ink);
    box-shadow:var(--bubble-shadow);
  }
  .new-chat:hover{ border-color:var(--focus); background:var(--panel-2); color:var(--ink); }
  .new-chat .plus{ color:var(--brand-2); font-weight:700; }

  .sec{ display:flex; flex-direction:column; gap:8px; }
  .sec-t{ font-size:11px; color:var(--ink-3); letter-spacing:1.5px; padding:0 4px; }
  .sid{
    display:inline-flex; align-items:center; gap:7px; align-self:flex-start; cursor:default;
    font:12px/1 ui-monospace,Consolas,"Cascadia Code",monospace; color:var(--ink-2);
    background:var(--panel); border:1px solid var(--line); padding:7px 10px; border-radius:9px;
    box-shadow:var(--bubble-shadow);
  }
  .sid .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none;
             box-shadow:0 0 8px rgba(52,211,153,.85); }
  .sid em{ font-style:normal; letter-spacing:.3px; }
  .sid b{ font:600 10.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.5px;
          color:var(--ink-3); padding-right:7px; border-right:1px solid var(--line-2); }
  .sid .dot.u{ background:var(--brand-2); box-shadow:0 0 8px rgba(56,189,248,.8); }
  #userBadge{ cursor:pointer; }
  #userBadge:hover{ border-color:var(--focus); }
  .kv{ display:flex; justify-content:space-between; align-items:center;
       font-size:12.5px; color:var(--ink-2); background:var(--panel);
       border:1px solid var(--line); border-radius:9px; padding:7px 10px;
       box-shadow:var(--bubble-shadow); }
  .kv em{ font-style:normal; font-family:ui-monospace,Consolas,monospace; color:var(--ink); }

  .side-foot{ margin-top:auto; font-size:10.5px; color:var(--ink-3); padding:0 4px; line-height:1.7; }
  @media (max-width: 860px){ .side{ display:none; } }

  /* ---- 本会话统计 ---- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .stat{
    display:flex; flex-direction:column; gap:2px; padding:7px 9px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--bubble-shadow);
  }
  .stat span{ font-size:10.5px; color:var(--ink-3); letter-spacing:.2px; }
  .stat em{
    font-style:normal; font:600 14px/1.2 ui-monospace,Consolas,monospace; color:var(--ink);
  }
  .stat-note{ font-size:10.5px; color:var(--ink-3); padding:0 4px; line-height:1.6; }

  /* ---- 「我」名下的数据（来自 GET /state，只读） ---- */
  .data-row{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--bubble-shadow);
  }
  .data-item{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2);
  }
  .data-item em{
    font-style:normal; font:600 13px/1 ui-monospace,Consolas,monospace; color:var(--ink);
  }
  .data-item + .data-item{ margin-left:4px; }
  .di{ width:6px; height:6px; border-radius:2px; flex:none; }
  .di.todo{ background:var(--brand); }
  .di.memo{ background:var(--brand-2); }
  .dt-refresh{
    margin-left:auto; flex:none; width:22px; height:22px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px; border:1px solid var(--line); background:transparent;
    color:var(--ink-3); font-size:12px; line-height:1;
  }
  .dt-refresh:hover{ border-color:var(--focus); color:var(--ink-2); }
  .dt-refresh.spin-once{ animation:spin .6s linear; }
  .data-row.loading .data-item em{ opacity:.4; }

  /* ================= 主区 ================= */
  .main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }

  header.main-hd{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:13px 24px; border-bottom:1px solid var(--line); background:transparent;
  }
  .main-hd b{ font-size:14.5px; font-weight:650; }
  .main-hd .hd-note{ font-size:11.5px; color:var(--ink-3); }

  #themeBtn{
    margin-left:auto; width:32px; height:32px; flex:none; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1;
    border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  }
  #themeBtn:hover{ border-color:var(--focus); color:var(--ink); }

  .notice{
    flex:none; padding:9px 24px; font-size:12.5px; display:flex; align-items:center; gap:8px;
    background:var(--warn-bg); color:var(--warn-ink); border-bottom:1px solid var(--warn-line);
  }
  .notice::before{ content:''; width:6px; height:6px; border-radius:50%; background:#e0a93b; flex:none; }
  .notice.hidden{ display:none; }

  /* ================= 消息区 ================= */
  #msgs{ flex:1 1 auto; overflow-y:auto; padding:26px 26px 12px; display:flex; flex-direction:column; gap:16px; }
  #msgs::-webkit-scrollbar{ width:10px; }
  #msgs::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:6px; border:3px solid var(--bg); }
  #msgs::-webkit-scrollbar-thumb:hover{ background:var(--focus); }

  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .row{ display:flex; animation:rise .26s cubic-bezier(.22,.8,.3,1) both; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }
  .bubble{ max-width:min(780px,88%); padding:11px 15px; border-radius:16px; word-break:break-word; }
  .row.user .bubble{
    background:var(--bubble-grad); color:#fff; white-space:pre-wrap;
    border-radius:16px 16px 5px 16px; box-shadow:0 8px 20px -12px rgba(79,70,229,.7);
  }
  .row.bot .bubble{
    background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 16px 5px;
    box-shadow:var(--bubble-shadow);
  }
  .row.bot .bubble.warn{ background:var(--warn-bg); border-color:var(--warn-line); }
  .row.bot .bubble.err{ background:var(--err-bg); border-color:var(--err-line); color:var(--err-ink); }
  .row.bot .bubble.restored{ border-style:dashed; }
  .restored-tag{
    display:block; margin-top:8px; padding-top:7px; font-size:10.5px; opacity:.75;
    border-top:1px dashed var(--line-2);
  }
  .errtag{
    display:inline-block; margin-top:8px; padding:3px 7px; border-radius:5px;
    font:11px/1 ui-monospace,monospace; color:var(--ink-2); background:var(--bg); border:1px solid var(--line);
  }

  /* 空状态（大标题 + 三卡） */
  .empty{ margin:auto; text-align:center; padding:10px 0 26px; animation:rise .35s both; max-width:720px; }
  .empty-pill{
    display:inline-flex; align-items:center; gap:7px; margin-bottom:22px;
    font-size:12px; color:var(--ink-2);
    background:var(--panel); border:1px solid var(--line-2); border-radius:999px; padding:6px 14px;
    box-shadow:var(--bubble-shadow);
  }
  .empty-pill .sp{ color:var(--brand-2); }
  .empty-h{ margin:0 0 12px; font-size:34px; line-height:1.32; font-weight:700; letter-spacing:.5px; color:var(--ink); }
  .empty-h em{
    font-style:normal;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .empty-s{ font-size:13px; color:var(--ink-2); margin-bottom:30px; }
  .cards{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .card-s{
    flex:1 1 0; min-width:180px; max-width:230px; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    box-shadow:var(--bubble-shadow);
    transition:border-color .16s, background .16s, transform .16s, box-shadow .16s;
  }
  .card-s:hover{ border-color:var(--focus); background:var(--panel-2); transform:translateY(-2px); box-shadow:var(--shadow); }
  .card-s b{ display:block; font-size:14px; font-weight:650; margin-bottom:4px; color:var(--ink); }
  .card-s span{ display:flex; align-items:center; gap:6px; font:11px/1.5 ui-monospace,Consolas,monospace; color:var(--ink-3); }
  .card-s span i{ font-style:normal; color:var(--brand-2); }

  /* ================= 决策卡（跟随主题，与气泡同族） ================= */
  .card{
    margin-top:12px; border-radius:12px; overflow:hidden;
    background:var(--dc-bg); border:1px solid var(--dc-line); color:var(--dc-ink);
    font:12.5px/1.6 ui-monospace,Consolas,"Cascadia Code","Courier New",monospace;
  }
  .card-hd{
    display:flex; align-items:center; gap:8px; padding:8px 13px; cursor:pointer;
    background:var(--dc-hd); user-select:none;
  }
  .card-hd:hover{ filter:brightness(.98); }
  html[data-theme="dark"] .card-hd:hover{ filter:brightness(1.15); }
  .caret{ color:var(--dc-caret); font-size:10px; transition:transform .18s; }
  .card.collapsed .caret{ transform:rotate(-90deg); }
  .card.collapsed .steps{ display:none; }
  .card-hd .tag{ color:var(--dc-tag); font-weight:600; font-size:11.5px; letter-spacing:.4px; }
  .card-hd .meta{ margin-left:auto; color:var(--dc-meta); font-size:11.5px; }
  .card-hd .per-step{
    margin-left:8px; padding-left:8px; border-left:1px solid var(--dc-line);
    font-family:ui-monospace,Consolas,monospace; color:var(--dc-sum-weak);
  }
  @media (max-width: 640px){ .card-hd .per-step{ display:none; } }
  .steps{ list-style:none; margin:0; padding:10px 13px 12px; }
  .steps li{ position:relative; padding-left:27px; padding-bottom:13px; }
  .steps li:last-child{ padding-bottom:0; }
  .steps li::before{
    content:''; position:absolute; left:8px; top:19px; bottom:-1px; width:1px;
    background:var(--dc-axis);
  }
  .steps li:last-child::before{ display:none; }
  .node{
    position:absolute; left:0; top:3px; width:17px; height:17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--dc-node-ink); background:var(--dc-node-bg); border:1px solid var(--dc-node-line);
  }
  .st-head{ display:flex; align-items:center; gap:8px; min-height:17px; }
  .type{ padding:1.5px 7px; border-radius:5px; font-size:11px; font-weight:600; letter-spacing:.2px; }
  .t-cmd{ background:var(--tc-cmd-bg); color:var(--tc-cmd-ink); }
  .t-ans{ background:var(--tc-ans-bg); color:var(--tc-ans-ink); }
  .t-chat{ background:var(--tc-chat-bg); color:var(--tc-chat-ink); }
  .t-other{ background:var(--tc-chat-bg); color:var(--tc-chat-ink); }
  .tool{ color:var(--dc-tool); }
  .tool.none{ color:var(--dc-tool-none); }
  .args{ display:block; margin-top:6px; color:var(--dc-arg); white-space:pre-wrap; word-break:break-all; }
  .args .k{ color:var(--dc-k); }
  .args .v{ color:var(--dc-v); }
  .args .p{ color:var(--dc-p); }
  .result{
    margin-top:4px; padding-left:1px; color:var(--dc-res); white-space:pre-wrap;
    max-height:6.6em; overflow:auto;
  }
  .result::-webkit-scrollbar{ width:6px; }
  .result::-webkit-scrollbar-thumb{ background:var(--dc-bar); border-radius:3px; }

  /* ---- 本轮摘要：只在卡片收起时显示，让人不看内容也知道「这轮干了什么」 ---- */
  .sum{
    display:none; align-items:center; flex-wrap:wrap; gap:6px;
    padding:0 13px 9px; font-size:11.5px; color:var(--dc-sum-ink);
    line-height:1.5;
  }
  .card.collapsed .sum{ display:flex; }
  .sum .s-arrow{ color:var(--dc-sum-weak); }
  .sum .s-tool{ color:var(--dc-sum-tool); font-weight:600; }
  .sum .s-tool.none{ color:var(--dc-sum-weak); font-weight:400; }
  .sum .s-note{ color:var(--dc-sum-weak); }
  .sum .s-ok{ color:var(--rt-ok-ink); }
  .sum .s-warn{ color:var(--rt-warn-ink); }
  .sum .s-bad{ color:var(--rt-bad-ink); }

  /* ---- 语义化入参：不给裸 JSON，按工具翻译成人话 ---- */
  .dargs{ display:block; margin-top:6px; }
  .dargs .ln{ display:flex; align-items:baseline; gap:7px; margin-top:3px; flex-wrap:wrap; }
  .dargs .ln:first-child{ margin-top:0; }
  .dargs .lbl{ flex:none; color:var(--dg-lbl); font-size:11px; }
  .dargs .lit{
    color:var(--dg-lit); border-left:2px solid var(--dg-quote-line); padding-left:8px;
    word-break:break-word;
  }
  .dargs .num{
    flex:none; padding:1px 7px; border-radius:5px; font-size:11.5px;
    background:var(--dg-num-bg); color:var(--dg-num-ink); font-weight:600;
  }
  .dargs .code{
    color:var(--dc-arg); word-break:break-word; font-family:inherit;
  }
  .dargs .code .k{ color:var(--dc-k); }
  .dargs .code .p{ color:var(--dc-p); }
  .dargs .code .v{ color:var(--dc-v); }

  /* ---- 每步耗时：数字 + 比例条（≥300ms 才画条，避免噪声） ---- */
  .step-ms{
    display:flex; align-items:center; gap:7px; margin-top:5px;
    font-size:11px; color:var(--dc-meta);
  }
  .step-ms .ms-k{ color:var(--dc-sum-weak); }
  .step-ms .ms-v{
    color:var(--dc-ink); font-weight:600;
    font-family:ui-monospace,Consolas,monospace;
  }
  .step-ms .ms-bar{
    flex:1; max-width:110px; height:3px; border-radius:2px;
    background:var(--dc-axis); overflow:hidden;
  }
  .step-ms .ms-bar i{
    display:block; height:100%; border-radius:2px;
    background:var(--dc-tool);
  }

  /* ---- 工具回执：成功 / 提示 / 失败 三种态，不再和正文一个颜色 ---- */
  .result{ border-radius:8px; padding:6px 9px; margin-top:6px; max-height:7.6em; }
  .result.rt-ok{ background:var(--rt-ok-bg); border:1px solid var(--rt-ok-line); color:var(--rt-ok-ink); }
  .result.rt-warn{ background:var(--rt-warn-bg); border:1px solid var(--rt-warn-line); color:var(--rt-warn-ink); }
  .result.rt-bad{ background:var(--rt-bad-bg); border:1px solid var(--rt-bad-line); color:var(--rt-bad-ink); }
  .result.rt-plain{ background:transparent; border:1px solid transparent; color:var(--dc-res); padding-left:1px; }

  /* ---- 工具执行状态徽章 ---- */
  .rchip{
    padding:1px 6px; border-radius:5px; font-size:10.5px; font-weight:600;
    letter-spacing:.2px; border:1px solid transparent;
  }
  .rchip.ok{ background:var(--rt-ok-bg); border-color:var(--rt-ok-line); color:var(--rt-ok-ink); }
  .rchip.warn{ background:var(--rt-warn-bg); border-color:var(--rt-warn-line); color:var(--rt-warn-ink); }
  .rchip.bad{ background:var(--rt-bad-bg); border-color:var(--rt-bad-line); color:var(--rt-bad-ink); }
  .rchip.plain{ color:var(--dc-sum-weak); }

  /* 打字指示 */
  .typing .bubble{ display:flex; gap:5px; align-items:center; padding:14px 16px; }
  .typing .d{ width:6px; height:6px; border-radius:50%; background:var(--line-2); animation:blink 1.2s infinite; }
  .typing .d:nth-child(2){ animation-delay:.18s; }
  .typing .d:nth-child(3){ animation-delay:.36s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.3; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }

  /* ================= 输入舱 ================= */
  footer{ flex:none; padding:12px 26px 20px; }
  .input-bar{
    display:flex; align-items:flex-end; gap:10px; max-width:860px; margin:0 auto;
    background:var(--panel); border:1px solid var(--line-2); border-radius:16px;
    padding:9px 9px 9px 16px; box-shadow:var(--bubble-shadow);
    transition:border-color .15s, box-shadow .15s;
  }
  .input-bar:focus-within{ border-color:var(--focus); box-shadow:0 0 0 3px rgba(99,102,241,.13); }
  textarea{
    flex:1; resize:none; min-height:24px; max-height:150px; padding:5px 0; outline:none;
    font:inherit; line-height:1.55; color:var(--ink); background:transparent; border:none;
  }
  textarea::placeholder{ color:var(--ink-3); }
  .input-bar.shake{ animation:shake .3s; border-color:#c8665e; }
  @keyframes shake{ 25%{ transform:translateX(-3px); } 75%{ transform:translateX(3px); } }

  #sendBtn{
    width:38px; height:38px; flex:none; padding:0; border-radius:12px; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--grad); color:#fff;
    transition:filter .15s, opacity .15s, transform .1s;
  }
  #sendBtn:hover{ filter:brightness(1.08); }
  #sendBtn:active{ transform:translateY(1px); }
  #sendBtn:disabled{ opacity:.55; cursor:not-allowed; filter:none; }
  #sendBtn svg{ display:block; }
  .spin{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <span class="logo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" aria-hidden="true">
        <circle cx="7" cy="7" r="2.3"/><circle cx="17" cy="7" r="2.3"/>
        <circle cx="7" cy="17" r="2.3"/><circle cx="17" cy="17" r="2.3"/>
      </svg>
    </span>
    <div class="title">
      <b>Agent 控制台</b>
    </div>
  </div>

  <button id="newBtn" class="new-chat"><span class="plus">＋</span> 新会话</button>

  <div class="sec">
    <div class="sec-t">身份 / 当前会话</div>
    <span class="sid" id="userBadge" title="点击复制 user_id"><b>我</b><i class="dot u"></i><em>—</em></span>
    <span class="sid" id="sidBadge" title=""><b>本次</b><i class="dot"></i><em>—</em></span>
    <div class="kv"><span>消息数</span><em id="msgCount">0</em></div>
  </div>

  <div class="sec">
    <div class="sec-t">本会话统计</div>
    <div class="stat-grid">
      <div class="stat"><span>提问轮次</span><em id="stTurn">0</em></div>
      <div class="stat"><span>工具调用</span><em id="stTool">0</em></div>
      <div class="stat"><span>平均耗时</span><em id="stAvg">—</em></div>
      <div class="stat"><span>最慢一轮</span><em id="stMax">—</em></div>
    </div>
    <div class="stat-note" id="stNote">问几句，这里会累计本会话的路由与工具数据。</div>
  </div>

  <div class="sec">
    <div class="sec-t">「我」名下的数据</div>
    <div class="data-row">
      <span class="data-item"><i class="di todo"></i>待办 <em id="dtTodo">—</em></span>
      <span class="data-item"><i class="di memo"></i>备忘录 <em id="dtMemo">—</em></span>
      <button id="dtRefresh" class="dt-refresh" title="重新读取">↻</button>
    </div>
    <div class="stat-note" id="dtNote">只读；切换「我」或点「新会话」会自动刷新。</div>
  </div>

  <div class="side-foot">
    待办与备忘录挂在「我」这个身份下，关掉浏览器也还在；「本次」只决定这次聊什么，点「新会话」就换一个。
  </div>
</aside>

<div class="main">
  <header class="main-hd">
    <b id="convTitle">新的对话</b>
    <span class="hd-note">Enter 发送 · Shift+Enter 换行 · 决策卡点标题栏展开</span>
    <button id="themeBtn" title="切换深色 / 浅色">☾</button>
  </header>

  <div class="notice hidden" id="notice"></div>
  <main id="msgs"></main>

  <footer>
    <div class="input-bar" id="inputBar">
      <textarea id="input" rows="1" placeholder="给 Agent 发消息…"></textarea>
      <button id="sendBtn" title="发送 (Enter)">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
          <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var SID_KEY   = 'va_session_id';
  var UID_KEY   = 'va_user';        // 长期身份：关浏览器也还在
  var THEME_KEY = 'va_theme';

  var msgs      = document.getElementById('msgs');
  var input     = document.getElementById('input');
  var inputBar  = document.getElementById('inputBar');
  var sendBtn   = document.getElementById('sendBtn');
  var newBtn    = document.getElementById('newBtn');
  var sidBadge  = document.getElementById('sidBadge');
  var sidText   = sidBadge.querySelector('em');
  var userBadge = document.getElementById('userBadge');
  var userText  = userBadge.querySelector('em');
  var notice    = document.getElementById('notice');
  var convTitle = document.getElementById('convTitle');
  var msgCount  = document.getElementById('msgCount');
  var themeBtn  = document.getElementById('themeBtn');

  var ICON_SEND =
    '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">' +
    '<path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>';

  /* ============ 主题：默认浅色，可切深色（跨会话记住） ============ */
  var theme = 'light';
  try { theme = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { theme = 'light'; }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = (t === 'dark') ? '☀' : '☾';
    themeBtn.title = (t === 'dark') ? '切到浅色' : '切到深色';
  }
  applyTheme(theme);
  themeBtn.addEventListener('click', function () {
    theme = (theme === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* 隐私模式下忽略 */ }
    applyTheme(theme);
  });

  /* ============ 两种 id，各管一件事 ============ */
  // user_id    → 「你是谁」：localStorage，关标签 / 重启浏览器都还在，待办和备忘录挂在它下面
  // session_id → 「这次聊什么」：sessionStorage，关标签就换新的，对话上下文跟着它走
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    // 兜底（非 secure context 时）：仍要满足后端白名单 [a-zA-Z0-9_-]
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  // 隐私模式下 localStorage 读写会直接抛，包一层别让它把整个脚本打死
  function readStore(store, key) {
    try { return store.getItem(key); } catch (e) { return null; }
  }
  function writeStore(store, key, val) {
    try { store.setItem(key, val); } catch (e) { /* 存不下就只在内存里用 */ }
  }

  var uid = readStore(localStorage, UID_KEY);
  if (!uid) { uid = genId(); writeStore(localStorage, UID_KEY, uid); }

  var sid = readStore(sessionStorage, SID_KEY);
  if (!sid) { sid = genId(); writeStore(sessionStorage, SID_KEY, sid); }

  function paintUser() {
    userText.textContent = uid.slice(0, 8);
    userBadge.title = 'user_id: ' + uid + '\n单击复制 · 双击粘贴恢复';
  }
  function paintSid() {
    sidText.textContent = sid.slice(0, 8);
    sidBadge.title = 'session_id: ' + sid;
  }
  function resetSid() {            // 只换会话，不动身份
    sid = genId();
    writeStore(sessionStorage, SID_KEY, sid);
    paintSid();
  }
  function resetUid() {            // 只在服务端判定本地标识非法时调用
    uid = genId();
    writeStore(localStorage, UID_KEY, uid);
    paintUser();
  }
  paintUser();
  paintSid();

  /* ============ 身份标识：单击复制 / 双击粘贴恢复 ============ */
  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(s).catch(function () { legacyCopy(s); });
    }
    legacyCopy(s);
    return Promise.resolve();
  }
  function legacyCopy(s) {          // http 页面（非 secure context）没有 clipboard API
    var ta = document.createElement('textarea');
    ta.value = s;
    ta.style.position = 'fixed';
    ta.style.top = '-999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* 复制失败就算了 */ }
    ta.remove();
  }

  var userClickTimer = null;
  userBadge.addEventListener('click', function () {
    if (userClickTimer) return;               // 第二次点击交给 dblclick
    userClickTimer = setTimeout(function () {
      userClickTimer = null;
      copyText(uid).then(function () {
        showNotice('user_id 已复制：' + uid + '（换浏览器后双击这里粘贴即可恢复同一份数据）');
      });
    }, 220);
  });
  userBadge.addEventListener('dblclick', function () {
    if (userClickTimer) { clearTimeout(userClickTimer); userClickTimer = null; }
    var v = window.prompt('粘贴一个已有的 user_id，切回那份待办 / 备忘录：', uid);
    if (v === null) return;
    v = v.trim();
    if (!v) return;
    if (!/^[a-zA-Z0-9_-]{1,64}$/.test(v)) {
      showNotice('格式不对：只允许字母、数字、下划线、短横线，最长 64 位。');
      return;
    }
    uid = v.toLowerCase();                    // 后端会转小写，这里保持一致
    writeStore(localStorage, UID_KEY, uid);
    paintUser();
    refreshState();                           // 换身份 = 换一整套数据，立刻重读
    showNotice('身份已切换，发一句话就会读写这个身份下的待办和备忘录。');
  });

  /* ============ 侧栏：消息数 / 会话标题 ============ */
  function updateCount() {
    msgCount.textContent = String(msgs.querySelectorAll('.row').length);
  }
  function setTitleFrom(text) {
    if (convTitle.textContent === '新的对话') {
      convTitle.textContent = text.length > 16 ? text.slice(0, 16) + '…' : text;
    }
  }

  /* ============ 本会话统计 ============
     只统计这一次会话（点「新会话」归零），不对应后端的持久数据。
     口径：提问轮次 = 成功返回的次数；工具调用 = steps 里 type=command 的步数；
           耗时取后端 elapsed_ms，不含网络排队。                          */
  var STAT = { turn: 0, tool: 0, msSum: 0, msMax: 0, fail: 0 };
  var stTurn = document.getElementById('stTurn');
  var stTool = document.getElementById('stTool');
  var stAvg  = document.getElementById('stAvg');
  var stMax  = document.getElementById('stMax');
  var stNote = document.getElementById('stNote');

  function fmtMs(v) {
    return v >= 1000 ? (v / 1000).toFixed(2) + 's' : Math.round(v) + 'ms';
  }
  function clearStat() {
    STAT = { turn: 0, tool: 0, msSum: 0, msMax: 0, fail: 0 };
    paintStat();
  }
  function paintStat() {
    stTurn.textContent = String(STAT.turn);
    stTool.textContent = String(STAT.tool);
    stAvg.textContent  = STAT.turn ? fmtMs(STAT.msSum / STAT.turn) : '—';
    stMax.textContent  = STAT.turn ? fmtMs(STAT.msMax) : '—';
    if (!STAT.turn) {
      stNote.textContent = '问几句，这里会累计本会话的路由与工具数据。';
    } else if (STAT.fail) {
      stNote.textContent = '其中 ' + STAT.fail + ' 轮未拿到工具结果（模型不可用 / 内部错误）。';
    } else {
      stNote.textContent = '平均每轮 ' + fmtMs(STAT.msSum / STAT.turn) + '，共 ' + STAT.tool + ' 次工具调用。';
    }
  }
  function recordStat(data) {
    if (typeof data.elapsed_ms === 'number' && data.elapsed_ms > 0) {
      STAT.turn += 1;
      STAT.msSum += data.elapsed_ms;
      if (data.elapsed_ms > STAT.msMax) STAT.msMax = data.elapsed_ms;
    }
    if (data.steps && data.steps.length) {
      STAT.tool += data.steps.filter(function (s) {
        return s.type === 'command' && s.tool;
      }).length;
    }
    if (!data.ok) STAT.fail += 1;
    paintStat();
  }

  /* ============ 「我」名下的数据：GET /state 只读拉取 ============
     这个接口证明的是「user_id 决定数据落哪个目录」——
     换 session 数字不变，换 user_id 数字才变。                       */
  var dtTodo = document.getElementById('dtTodo');
  var dtMemo = document.getElementById('dtMemo');
  var dtNote = document.getElementById('dtNote');
  var dtRefresh = document.getElementById('dtRefresh');
  var dataRow = dtRefresh.parentNode;
  var stateSeq = 0;        // 防止慢响应覆盖快响应

  function paintData(d) {
    dtTodo.textContent = String(d.todo_count);
    dtMemo.textContent = String(d.memo_count);
    if (d.todo_count === 0 && d.memo_count === 0) {
      dtNote.textContent = '这个身份下还没有数据，说句话让 Agent 记一条试试。';
    } else {
      dtNote.textContent = '会话里有 ' + d.turns + ' 轮；换「本次」数字不变，换「我」才会变。';
    }
  }
  function paintDataError(msg) {
    dtTodo.textContent = '—';
    dtMemo.textContent = '—';
    dtNote.textContent = msg;
  }
  function refreshState() {
    var seq = ++stateSeq;
    dataRow.classList.add('loading');
    var qs = '/state?user_id=' + encodeURIComponent(uid) +
             '&session_id=' + encodeURIComponent(sid);
    fetch(qs)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (seq !== stateSeq) return;      // 已有更新的请求在跑，丢弃这次
        paintData(d);
      })
      .catch(function () {
        if (seq !== stateSeq) return;
        paintDataError('读取失败：确认后端已启动。');
      })
      .then(function () {
        if (seq === stateSeq) dataRow.classList.remove('loading');
      });
  }
  dtRefresh.addEventListener('click', function () {
    refreshState();
    dtRefresh.classList.remove('spin-once');
    void dtRefresh.offsetWidth;
    dtRefresh.classList.add('spin-once');
  });

  /* ============ 刷新恢复：GET /history 把这次的对话画回来 ============
     只恢复原文，决策卡回不来（后端 chat_history 只存了 text）。
     所以恢复出来的气泡用虚线边 + 「决策卡未保存」角标，不假装有卡片。 */
  var restoreSeq = 0;

  function restoreHistory(next) {
    var seq = ++restoreSeq;
    var qs = '/history?session_id=' + encodeURIComponent(sid);
    fetch(qs)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (seq !== restoreSeq) return;
        var list = (d && d.messages) || [];
        if (!list.length) return;      // 没历史就保持空状态

        // 先清屏（空状态 / 已有的行），再按顺序重放
        Array.prototype.forEach.call(
          msgs.querySelectorAll('.row, .empty'), function (el) { el.remove(); });

        var lastUser = '';
        list.forEach(function (m) {
          if (m.role === 'user') {
            lastUser = m.text;
            addUser(m.text);
          } else {
            addBot({ ok: true, reply: m.text, steps: [], restored: true });
          }
        });
        if (lastUser) setTitleFrom(lastUser);
        // clearEmpty 在 addUser 里被调过，这里不重复
      })
      .catch(function () { /* 拉不到历史不影响正常使用，静默 */ })
      .then(function () {
        if (typeof next === 'function') next();
      });
  }

  /* ============ 顶部提示条 ============ */
  var noticeTimer = null;
  function showNotice(text) {
    notice.textContent = text;
    notice.classList.remove('hidden');
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(hideNotice, 4500);
  }
  function hideNotice() {
    notice.classList.add('hidden');
    if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }
  }

  /* ============ 通用小工具 ============ */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function scrollDown() {
    requestAnimationFrame(function () { msgs.scrollTop = msgs.scrollHeight; });
  }
  function clearEmpty() {
    var e = msgs.querySelector('.empty');
    if (e) e.remove();
  }

  /* ============ 空状态：大标题 + 场景卡 ============ */
  // 每张卡都对应一条「这个 Agent 真正难的地方」，而不是随手写的 hello world
  var SCENARIOS = [
    { t: '记一条待办',   s: 'command → add_todo',     n: '落盘',   q: '帮我记一下明天交水电费' },
    { t: '多轮改口',     s: '候选 → 第 2 条',          n: '两轮',   q: '帮我把待办里带「水电」的那条删掉' },
    { t: '查实时信息',   s: 'tool → web_search',      n: 'ReAct',  q: '北京今天天气怎么样' },
    { t: '纯闲聊不落库', s: 'chat → 不调用工具',      n: '分离',   q: '你好，你是谁' }
  ];
  function showEmpty() {
    var box = document.createElement('div');
    box.className = 'empty';

    var pill = document.createElement('div');
    pill.className = 'empty-pill';
    pill.innerHTML = '<span class="sp">✦</span> Agent 控制台 · 决策全程可见';

    var h = document.createElement('h1');
    h.className = 'empty-h';
    h.innerHTML = '把任务，交给<br><em>会思考的 Agent</em>';

    var s = document.createElement('div');
    s.className = 'empty-s';
    s.textContent = '路由 · 工具 · 多轮记忆 —— 每一步决策过程都摊开给你看';

    var cards = document.createElement('div');
    cards.className = 'cards';
    SCENARIOS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'card-s';
      b.type = 'button';
      b.innerHTML = '<b>' + esc(c.t) + '</b>' +
                    '<span><i>' + esc(c.s) + '</i> · ' + esc(c.n) + '</span>';
      b.addEventListener('click', function () {
        input.value = c.q;
        autoGrow();
        send();
      });
      cards.appendChild(b);
    });

    box.appendChild(pill);
    box.appendChild(h);
    box.appendChild(s);
    box.appendChild(cards);
    msgs.appendChild(box);
  }

  /* ============ 消息渲染 ============ */
  function addUser(text) {
    clearEmpty();
    setTitleFrom(text);
    var row = document.createElement('div');
    row.className = 'row user';
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    updateCount();
    scrollDown();
  }

  function addSys(text) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row bot';
    var b = document.createElement('div');
    b.className = 'bubble err';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    updateCount();
    scrollDown();
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'row bot typing';
    var b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = '<span class="d"></span><span class="d"></span><span class="d"></span>';
    row.appendChild(b);
    msgs.appendChild(row);
    scrollDown();
    return row;
  }

  var TYPE_CLS = { command: 't-cmd', answer: 't-ans', chat: 't-chat' };

  /* ============ 把一步决策翻译成人话 ============
     args 不再直接甩 JSON：按工具名决定怎么读才顺眼。
     形状：{ lines: [ {lbl, kind:'lit'|'num'|'code', v} ] }              */
  var ARG_HINT = {
    add_todo:     [['text', '内容', 'lit']],
    add_memo:     [['text', '内容', 'lit']],
    list_todo:    [],
    list_memo:    [],
    delete_todo:  [['lineno', '条号', 'num'], ['keyword', '关键词', 'lit']],
    delete_memo:  [['lineno', '条号', 'num'], ['keyword', '关键词', 'lit']],
    complete_todo:[['lineno', '条号', 'num']],
    web_search:   [['query', '查询', 'lit']],
    get_weather:  [['city', '城市', 'lit']]
  };

  function isBlank(v) { return v === undefined || v === null || v === ''; }

  function renderArgs(tool, args) {
    var keys = Object.keys(args || {});
    if (!keys.length) return null;

    var box = document.createElement('span');
    box.className = 'dargs';
    var hint = ARG_HINT[tool];
    var used = {};

    function pushLine(lbl, kind, v) {
      var ln = document.createElement('span');
      ln.className = 'ln';
      if (lbl) {
        var l = document.createElement('span');
        l.className = 'lbl';
        l.textContent = lbl;
        ln.appendChild(l);
      }
      var body = document.createElement('span');
      body.className = (kind === 'code') ? 'code' : (kind === 'num' ? 'num' : 'lit');
      if (kind === 'num') body.textContent = '第 ' + v + ' 条';
      else body.textContent = String(v);
      ln.appendChild(body);
      box.appendChild(ln);
    }

    if (hint) {
      hint.forEach(function (h) {
        var k = h[0];
        if (isBlank(args[k])) return;      // 二选一参数没给的那个不占位置
        used[k] = 1;
        pushLine(h[1], h[2], args[k]);
      });
      // lineno 是被 handle 换算过的真实行号：用户说「第 2 条」候选时，这里会是第 3 行。
      // 不标一句，人看到「第 3 条」会以为 Agent 删错了。
      if (!isBlank(args.lineno) && !isBlank(args.keyword)) {
        var tip = document.createElement('span');
        tip.className = 'ln';
        var tl = document.createElement('span');
        tl.className = 'lbl';
        tl.textContent = '·';
        var tb = document.createElement('span');
        tb.className = 'code';
        tb.textContent = '条号已按上一轮候选换算成真实行号';
        tip.appendChild(tl);
        tip.appendChild(tb);
        box.appendChild(tip);
      }
    }

    // 没登记过的工具 / 多出来的参数 → 原样显示，绝不吞
    var rest = keys.filter(function (k) { return !used[k]; });
    if (rest.length) {
      var ln = document.createElement('span');
      ln.className = 'ln';
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = '参数';
      var code = document.createElement('span');
      code.className = 'code';
      code.innerHTML = '{ ' + rest.map(function (k) {
        return '<span class="k">' + esc(JSON.stringify(k)) + '</span>' +
               '<span class="p">: </span>' +
               '<span class="v">' + esc(JSON.stringify(args[k])) + '</span>';
      }).join('<span class="p">, </span>') + ' }';
      ln.appendChild(lbl);
      ln.appendChild(code);
      box.appendChild(ln);
    }
    return box;
  }

  /* 回执状态：ok / warn / bad / plain —— 用文字判，不改后端 */
  function resultState(s) {
    var r = String(s || '');
    if (/失败|没有该记录|没有该事项|未找到|暂时不可用|没查到/.test(r)) return 'bad';
    if (/请确认|请提供|没识别到|请问你要查/.test(r)) return 'warn';
    if (/^已(加入|删除|标记)/.test(r) || /^共\d+条/.test(r)) return 'ok';
    return 'plain';
  }

  /* 摘要里的一句话结论：这一轮到底做成了没有 */
  function resultVerdict(st) {
    var r = String(st.result || '');
    var s = resultState(r);
    if (s === 'bad')   return { t: '未成功', c: 's-bad' };
    if (s === 'warn')  return { t: '待确认', c: 's-warn' };
    if (s === 'ok') {
      if (/^已加入/.test(r)) {
        var first = r.split('\n')[1];
        return { t: '已写入' + (first ? '「' + first + '」' : ''), c: 's-ok' };
      }
      if (/^共\d+条/.test(r)) {
        var m = r.match(/^共(\d+)条/);
        return { t: '查到 ' + m[1] + ' 条', c: 's-ok' };
      }
      if (/^已删除/.test(r)) return { t: '已删除', c: 's-ok' };
      return { t: '已完成', c: 's-ok' };
    }
    return null;
  }

  /* 一轮决策 → 一行摘要。多轮时只取「最后一步的结果」+「整轮的路径」 */
  function buildSummary(data) {
    var box = document.createElement('div');
    box.className = 'sum';

    var path = document.createElement('span');
    path.className = 's-path';
    var walk = data.steps.map(function (s) {
      return s.type + (s.tool ? '·' + s.tool : '');
    });
    // 连续重复的同一工具收成 "×N"，免得 tool→tool→tool 铺满一行
    var merged = [];
    walk.forEach(function (w) {
      var last = merged[merged.length - 1];
      if (last && last.k === w) last.n += 1;
      else merged.push({ k: w, n: 1 });
    });
    merged.forEach(function (m, i) {
      if (i) {
        var a = document.createElement('span');
        a.className = 's-arrow';
        a.textContent = ' → ';
        path.appendChild(a);
      }
      var t = document.createElement('span');
      var isTool = m.k.indexOf('·') > -1;
      t.className = 's-tool' + (isTool ? '' : ' none');
      t.textContent = m.k + (m.n > 1 ? '×' + m.n : '');
      path.appendChild(t);
    });
    box.appendChild(path);

    // 结论要取「最后一步真正调工具的返回」，不是最后一步本身：
    // 多轮收尾通常是 answer，拿它去判状态只会得到 null。
    var last = null;
    for (var i = data.steps.length - 1; i >= 0; i -= 1) {
      if (data.steps[i].type === 'command' && data.steps[i].tool) { last = data.steps[i]; break; }
    }
    var v = last ? resultVerdict(last) : null;
    if (v) {
      var sp = document.createElement('span');
      sp.className = 's-arrow';
      sp.textContent = '·';
      box.appendChild(sp);
      var vt = document.createElement('span');
      vt.className = v.c;
      vt.textContent = v.t;
      box.appendChild(vt);
    }
    return box;
  }

  function buildCard(data) {
    var n = data.steps.length;
    var box = document.createElement('div');
    box.className = 'card collapsed';   // 默认收起，点标题栏才展开

    var hd = document.createElement('div');
    hd.className = 'card-hd';
    // 总耗时后面跟一份逐步明细，不展开也能看出时间花在哪一步
    var perStep = data.steps.map(function (s) {
      return (typeof s.ms === 'number') ? s.ms + 'ms' : null;
    }).filter(function (v) { return v !== null; }).join(' / ');
    hd.innerHTML =
      '<span class="caret">▾</span>' +
      '<span class="tag">路由决策</span>' +
      '<span class="meta">' + n + ' 轮 · 共 ' + data.elapsed_ms + ' ms' +
        (perStep ? '<span class="per-step">' + perStep + '</span>' : '') +
      '</span>';
    hd.title = '点击展开 / 收起本轮决策';
    hd.addEventListener('click', function () { box.classList.toggle('collapsed'); });
    box.appendChild(hd);

    box.appendChild(buildSummary(data));   // 收起时才可见的一行结论

    var ol = document.createElement('ol');
    ol.className = 'steps';

    data.steps.forEach(function (s) {
      var li = document.createElement('li');

      var node = document.createElement('span');
      node.className = 'node';
      node.textContent = s.epoch;
      li.appendChild(node);

      var head = document.createElement('div');
      head.className = 'st-head';

      var t = document.createElement('span');
      t.className = 'type ' + (TYPE_CLS[s.type] || 't-other');
      t.textContent = s.type || '?';

      var tool = document.createElement('span');
      tool.className = 'tool' + (s.tool ? '' : ' none');
      tool.textContent = s.tool || '—';

      head.appendChild(t);
      head.appendChild(tool);

      // 只有真正调了工具的那一步，才在工具名后面标一次状态
      var st = null;
      if (s.type === 'command' && s.tool) {
        st = resultState(s.result);
        var chip = document.createElement('span');
        chip.className = 'rchip ' + st;
        chip.textContent = (st === 'ok') ? '成功' : (st === 'warn') ? '待确认'
                         : (st === 'bad') ? '失败' : '—';
        head.appendChild(chip);
      }
      li.appendChild(head);

      var dargs = renderArgs(s.tool, s.args);
      if (dargs) li.appendChild(dargs);

      // 每步耗时：ms 的口径是「本轮 route（模型决策）+ 纯执行」，
      // 所以 answer 步出现几百毫秒是正常的 —— 那是又一次模型往返。
      if (typeof s.ms === 'number') {
        var tm = document.createElement('div');
        tm.className = 'step-ms';
        tm.innerHTML = '<span class="ms-k">决策+执行</span>' +
                       '<span class="ms-v">' + s.ms + ' ms</span>' +
                       (s.ms >= 300 ? '<span class="ms-bar"><i style="width:' +
                         Math.min(100, Math.round(s.ms / 12)) + '%"></i></span>' : '');
        li.appendChild(tm);
      }

      if (s.result) {
        var r = document.createElement('div');
        r.className = 'result rt-' + (st || resultState(s.result));
        r.textContent = s.result;
        li.appendChild(r);
      }
      ol.appendChild(li);
    });

    box.appendChild(ol);
    return box;
  }

  function addBot(data) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row bot';

    var b = document.createElement('div');
    b.className = 'bubble';
    if (data.restored) {
      b.classList.add('restored');
    } else if (data.error === 'model_unavailable') {
      b.classList.add('warn');
    } else if (data.error === 'internal_error') {
      b.classList.add('err');
    }

    var p = document.createElement('div');
    p.textContent = data.reply || '（无回复）';
    b.appendChild(p);

    if (data.restored) {
      // 刷新恢复出来的消息：后端只留了原文，没有 steps，所以没有决策卡。
      // 说清楚「卡片没恢复」，而不是让人以为这次本来就没走工具。
      var hint = document.createElement('div');
      hint.className = 'errtag restored-tag';
      hint.textContent = '刷新前的一轮 · 决策卡未保存';
      b.appendChild(hint);
    } else if (data.steps && data.steps.length) {
      b.appendChild(buildCard(data));
    } else if (!data.ok && data.error) {
      var tag = document.createElement('div');
      tag.className = 'errtag';
      tag.textContent = data.error;
      b.appendChild(tag);
    }

    row.appendChild(b);
    msgs.appendChild(row);
    updateCount();
    scrollDown();
  }

  /* ============ 输入框 ============ */
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  }
  function flashInput() {
    inputBar.classList.remove('shake');
    void inputBar.offsetWidth;        // 强制重排，让动画能重放
    inputBar.classList.add('shake');
    input.focus();
  }

  var busy = false;
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    sendBtn.innerHTML = v ? '<span class="spin"></span>' : ICON_SEND;
    input.placeholder = v ? '正在处理…' : '给 Agent 发消息…';
  }

  /* ============ 发送 ============ */
  function send() {
    if (busy) return;
    var text = input.value;
    if (!text.trim()) { flashInput(); return; }

    hideNotice();
    addUser(text);
    input.value = '';
    autoGrow();
    setBusy(true);
    var typing = addTyping();

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid, user_id: uid, text: text })
    })
    .then(function (resp) {
      return resp.json().then(function (data) { return { status: resp.status, data: data }; });
    })
    .then(function (r) {
      var data = r.data;
      typing.remove();
      if (r.status === 400 && data.error === 'invalid_session_id') {
        resetSid();
        showNotice('会话标识已失效，已为你开启新会话，请重新发送。');
      } else if (r.status === 400 && data.error === 'invalid_user_id') {
        // 本地存的 uid 被服务端判为非法（被改坏 / 超长 / 带怪字符）→ 换一个新的
        // 代价：旧 uid 名下的数据从此读不到，但它们本来也已经访问不到了
        resetUid();
        showNotice('本地身份标识不合法，已换新身份，请重新发送。');
      } else if (r.status === 400 && data.error === 'invalid_text') {
        showNotice('内容不能为空。');
      } else {
        // 200 / 503 / 500 三种都直接渲染（reply 里就是给人看的话术）
        if (data.session_id) { sid = data.session_id; }   // 回带即采纳，保证前后端一致
        recordStat(data);
        addBot(data);
        refreshState();                                   // 工具可能刚改了数据，顺手重读
      }
      updateCount();
    })
    .catch(function (err) {
      typing.remove();
      // 页面若是被 IDE 静态预览（file:// 或 PyCharm 63342 / VSCode Live Server 5500）打开，
      // 那里没有 /chat 接口。不再用「端口是不是 8000」判断——线上跑在 7860，
      // 一次网络抖动就会让页面弹出「请访问 127.0.0.1:8000」这种错得离谱的提示。
      var isPreview = location.protocol === 'file:' ||
                      ['63342', '5500', '5501'].indexOf(location.port) !== -1;
      addSys(isPreview
        ? '无法连接服务：当前是从静态预览（' + (location.port || '本地文件') + '）打开的，这里没有 /chat 接口。请访问后端服务本身的地址。'
        : '无法连接服务：请确认服务已启动后再试。');
      updateCount();
    })
    .then(function () { setBusy(false); });
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function (e) {
    // isComposing：中文输入法选词时的回车不能当发送
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  newBtn.addEventListener('click', function () {
    resetSid();                                  // 只换会话：对话上下文清空，身份（数据）不动
    Array.prototype.forEach.call(msgs.querySelectorAll('.row, .empty'), function (el) { el.remove(); });
    convTitle.textContent = '新的对话';
    clearStat();                                 // 统计跟着会话走，一并归零
    showEmpty();
    updateCount();
    refreshState();                              // 换会话 → 数据条数应当不变，正好用来看
    showNotice('已开启新会话：对话上下文清空，待办和备忘录仍然保留。');
    input.focus();
  });

  showEmpty();
  autoGrow();
  updateCount();
  paintStat();
  refreshState();
  restoreHistory();          // 刷新回来时把这次的对话重新画一遍
  input.focus();
})();
</script>
</body>
</html>
